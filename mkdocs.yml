site_name: arch-map
site_description: Living C4-style diagram from Terraform state and K8s resources.
repo_url: https://github.com/fabiocicerchia/arch-map
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
