[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-map"
version = "0.2.1"
description = "Living C4-style diagram from Terraform state and K8s resources, committed to the repo"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/arch-map"
Issues = "https://github.com/fabiocicerchia/arch-map/issues"
Changelog = "https://github.com/fabiocicerchia/arch-map/blob/main/CHANGELOG.md"

[project.scripts]
arch-map = "arch_map:main"

[tool.setuptools]
py-modules = ["arch_map"]

[tool.pytest.ini_options]
# Without this pytest imports an installed arch_map from site-packages instead
# of the one in the checkout, so the suite grades a copy that is not in the tree.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# U+00D7 MULTIPLICATION SIGN is deliberate in the replica count ("api ×3"):
# it is what the label renders, and a lowercase x reads as part of the name.
allowed-confusables = ["×"]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]
