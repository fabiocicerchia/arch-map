[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-map"
version = "0.2.1"
description = "Living C4-style diagram from Terraform state and K8s resources, committed to the repo"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/arch-map"
Issues = "https://github.com/fabiocicerchia/arch-map/issues"
Changelog = "https://github.com/fabiocicerchia/arch-map/blob/main/CHANGELOG.md"

[project.scripts]
arch-map = "arch_map:main"

[tool.setuptools]
py-modules = ["arch_map"]

[tool.pytest.ini_options]
# Without this pytest imports an installed arch_map from site-packages instead
# of the one in the checkout, so the suite grades a copy that is not in the tree.
pythonpath = ["."]

[tool.ruff]
line-length = 100
